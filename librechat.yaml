endpoints:
  openRouter:
    apiKey: ${OPENROUTER_KEY}
    models:
      default:
        - deepseek/deepseek-v4-flash
        - openai/gpt-4o
        - openai/gpt-4o-mini
        - anthropic/claude-sonnet-4-20250514
        - google/gemini-2.5-flash-exp-08-28
      fetch: true

mcpServers:
  sabo:
    type: streamable-http
    url: https://sabo.thoughtfire.studio/mcp
    headers:
      Authorization: 'Bearer {{SABO_API_KEY}}'
    customUserVars:
      SABO_API_KEY:
        title: Sabo API Key
        description: "Your Sabo workspace API key (starts with sabo_live_)"
    startup: false