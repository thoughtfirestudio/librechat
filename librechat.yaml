endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - deepseek/deepseek-v4-flash
          - openai/gpt-4o
          - openai/gpt-4o-mini
        fetch: true
      titleConvo: true
      titleModel: "deepseek/deepseek-v4-flash"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter"

mcpServers:
  sabo:
    type: streamable-http
    url: https://sabo.thoughtfire.studio/mcp
    headers:
      Authorization: 'Bearer {{SABO_API_KEY}}'
    customUserVars:
      SABO_API_KEY:
        title: Sabo API Key
        description: "Your Sabo workspace API key (starts with sabo_live_)"
    startup: false